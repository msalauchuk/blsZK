[package]
name = "bls-zk-prover"
version = "1.0.0"
authors = ["ZK-Rollup"]
edition = "2021"
default-run = "bls-prover"
description = "Groth16 demo orchestration and native BLS12-381 reference verification"
license = "MIT"

[lib]
name = "bls_zk_prover"
path = "src/lib.rs"

[[bin]]
name = "bls-prover"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
clap = { version = "4.0", features = ["derive"] }
tempfile = "3.23"
blst = "=0.3.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"

[[bench]]
name = "proving_benchmark"
harness = false
